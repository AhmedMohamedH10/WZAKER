name: wzaker
version: '3.6.4'
summary: وذكر — مسبحة إلكترونية وأذكار وقرآن وأوقات صلاة
description: |
  تطبيق «وَذَكِّرْ»: مسبحة إلكترونية بواجهة عربية بالكامل، فيها الأذكار
  (حصن المسلم)، وقرآن الكريم، وأوقات الصلاة، وعدّ تسبيح يعمل مع أي برنامج
  على الجهاز.

  المزايا:
    • عدّ بالعجلة أو النقر على المسبحة أو بمفتاح المسافة أو بزر مخصص.
    • أذكار كاملة من «حصن المسلم» مع إمكانية إضافة أذكار خاصة.
    • أوقات صلاة لـ 36 مدينة وبـ 5 طرق حساب، مع تنبيهات اختيارية.
    • ختم وورد — التلاوة، التفسير، وخط المصحف.
    • إعدادات وإحصائيات محفوظة في الجهاز.

  نسخة لينكس من تطوير محمد زيتون، والمؤلف الأصلي للبرنامج أحمد بن محمد آل حسين.

base: core22
grade: stable
confinement: strict
license: MIT
compression: lzo

platforms:
  amd64:
    build-on: amd64
    build-for: amd64

apps:
  wzaker:
    command: bin/wzaker
    desktop: usr/share/applications/wzaker.desktop
    common-id: io.github.ahmedmohamedh10.wzaker
    extensions: [gnome]
    plugs:
      - home
      - opengl
      - wayland
      - x11
      - audio-playback
      - network
      - unity7
      - desktop
      - desktop-legacy
      - gsettings
    environment:
      GDK_BACKEND: x11
      NO_AT_BRIDGE: '1'
      PATH: $SNAP/usr/bin:$PATH

parts:
  wzaker:
    plugin: nil
    source: ../..
    build-packages:
      - build-essential
      - pkg-config
      - libwebkit2gtk-4.1-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libssl-dev
      - libxdo-dev
      - libx11-dev
      - curl
      - wget
      - file
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - librsvg2-2
      - libxdo3
    override-build: |
      set -eux
      cd src-tauri
      cargo build --release
      cd ..
      mkdir -p "${CRAFT_PART_INSTALL}/bin" "${CRAFT_PART_INSTALL}/usr/share/applications" \
               "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/apps"
      install -m755 src-tauri/target/release/wzaker "${CRAFT_PART_INSTALL}/bin/wzaker"
      strip --strip-unneeded "${CRAFT_PART_INSTALL}/bin/wzaker" || true
      install -m644 src/assets/logo.png "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/apps/wzaker.png"
      cat > "${CRAFT_PART_INSTALL}/usr/share/applications/wzaker.desktop" <<'EOF'
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=WZAKER
      Name[ar]=ذكر
      GenericName=سبحة وأذكار
      Comment=سبحة إلكترونية وأذكار وقرآن وأوقات صلاة
      Exec=wzaker
      Icon=wzaker
      Terminal=false
      Categories=Utility;Spirituality;
      Keywords=tasbih;azkar;quran;prayer;dhikr;ذكر;أذكار;قرآن;صلاة;
      StartupWMClass=wzaker
      EOF
