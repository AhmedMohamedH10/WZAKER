# Flatpak manifest — WZAKER (Linux)
# Build: flatpak-builder build-dir io.github.ahmedmohamedh10.wzaker.yaml --install --user --force-clean
# Bundle: flatpak build-bundle repo wzaker.flatpak io.github.ahmedmohamedh10.wzaker

app-id: io.github.ahmedmohamedh10.wzaker
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: wzaker

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=0

modules:
  - name: wzaker
    buildsystem: simple
    build-commands:
      - install -Dm755 wzaker /app/bin/wzaker
      - install -Dm644 wzaker.desktop /app/share/applications/io.github.ahmedmohamedh10.wzaker.desktop
      - install -Dm644 wzaker.png /app/share/icons/hicolor/256x256/apps/io.github.ahmedmohamedh10.wzaker.png
    sources:
      # ملفات تُنسخ إلى build-dir قبل البناء (أو استخدم type: file للمسار المحلي)
      - type: file
        path: /home/mohamedzaitoon/Projects/WZAKER/src-tauri/target/release/wzaker
        dest-filename: wzaker
      - type: file
        path: /home/mohamedzaitoon/Projects/WZAKER/packaging/flatpak/wzaker.desktop
      - type: file
        path: /home/mohamedzaitoon/Projects/WZAKER/packaging/flatpak/wzaker.png
