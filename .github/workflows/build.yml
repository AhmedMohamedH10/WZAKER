name: Build Windows Installer
on: [workflow_dispatch, push]

permissions:
  contents: write   # لازم علشان الـ workflow ينشر الـ Release

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install

      # الاختبارات الأول: لو فشلت مفيش Installer ولا Release
      - run: npm test

      # أي push عادي: بيبني الـ Installer ويرفعه كـ Artifact بس
      - name: Build (artifact only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build

      # push لـ tag زي v3.6.1: بيبني وبينشر Release على GitHub (الـ Installer + latest.yml بتاع التحديث التلقائي)
      - name: Build and publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish always -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }} -c.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: WZAKER-Setup
          path: dist/*.exe
