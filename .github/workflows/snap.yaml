name: Snap

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'النشر على Snap Store بعد البناء — يحتاج secret'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: بناء حزمة Snap
    runs-on: ubuntu-22.04
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تجهيز أدوات البناء
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev libx11-dev pkg-config build-essential
          sudo systemctl restart snapd.socket snapd.service 2>/dev/null || true
          sudo snap install snapcraft --classic
          snapcraft --version

      - name: تثبيت build-snaps يدويًا
        run: |
          # snapcraft(jit) بيفشل أحيانًا في تثبيت الـ build-snaps جوّه الـ runner
          sudo snap install rustup --classic || true
          sudo snap install gtk-common-themes || true
          sudo snap install gnome-42-2204 || true
          snap list | tail -8

      - name: البناء
        working-directory: packaging/snap
        run: |
          # snapd على الـ runner أحيانًا بيفشل في تثبيت الـ build-snaps — نعيد المحاولة
          for i in 1 2 3; do
            snapcraft pack --destructive-mode && break
            echo "المحاولة $i فشلت — إعادة المحاولة..."
            sudo systemctl restart snapd.socket snapd.service 2>/dev/null || true
            sleep 15
          done
          ls -l *.snap

      - name: رفع الحزمة كـ artifact
        uses: actions/upload-artifact@v4
        with:
          name: wzaker-snap
          path: packaging/snap/*.snap

  publish:
    name: نشر على Snap Store
    needs: build
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'true' }}
    steps:
      - name: سحب الحزمة
        uses: actions/download-artifact@v4
        with:
          name: wzaker-snap
          path: snap

      - name: تسجيل الدخول للمتجر
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          echo "$SNAPCRAFT_STORE_CREDENTIALS" | snapcraft login --store=admin

      - name: الرفع
        run: snapcraft upload --release "3.6.4" snap/*.snap
