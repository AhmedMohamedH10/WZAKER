<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' file: 'unsafe-inline'; script-src 'self' file: 'unsafe-inline'; media-src 'self' file: https: http:; font-src 'self' file:; img-src 'self' file: data:">
<title>WZAKER</title>
<link rel="stylesheet" href="theme.css">
<script src="shim.js"></script>
    <script src="firstword.js" defer></script>
<style>
  @font-face {
    font-family: 'Hail Elastic Light 1';
    src: url('assets/fonts/HailElasticLight1.ttf') format('truetype');
    font-weight: 100 900;      /* الخط بوزن واحد: بنعلن إنه بيغطي كل الأوزان علشان المتصفح ما يعملش Bold مصطنع */
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Inter';
    src: url('assets/fonts/Inter-VariableFont_opsz_wght.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0041-005A, U+0061-007A;   /* حروف إنجليزي بس: الأرقام والرموز بتفضل بخط Hail الأصلي في المسبحة */
  }
  @font-face {
    font-family: 'Hail Elastic Plain';
    src: url('assets/fonts/HailElasticLight.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: var(--font-main); color: var(--text); user-select: none; -webkit-user-select: none; cursor: grab; }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 1px solid var(--accent); }

  /* مساحة للـ glow والظل: كل الـ shadows تحت لازم تكون أصغر من الهوامش دي، وإلا بتتقص عند حافة النافذة وتبان بحافة حادة.
     (الجوانب 26 | فوق 22 | تحت 34 — لازم POPUP_W في main.js = 352 + 2×26) */
  .stage { position: absolute; top: 0; left: 0; padding: 22px 26px 34px; width: 404px; transform-origin: 0 0; }
  /* العرض ثابت 404 والحجم بـ transform (الصفحة بتبلّغ بارتفاعها بعد الحجم).
     position:absolute + left:0 مهم: الصفحة RTL، فالعنصر الأعرض من النافذة كان بيلتصق باليمين ويطلع بره من الشمال، وبعدين الـ scale من الركن الشمال-فوق
     (اللي بره الشاشة) كان بيزحزح المحتوى ويقصّه عند أي حجم غير 100%. كده الركن ثابت على (0,0) وكل حجم بيتصغّر من نفس النقطة. */

  /* ───── الإشعار نفسه (الحدود الخارجية = المؤقت أثناء التحدي) ───── */
  .pop {
    --r: 26px;
    position: relative; border-radius: var(--r);
    background: var(--bg);
    border: 1px solid var(--line);
    box-shadow: 0 8px 22px rgba(0, 0, 0, .42), 0 0 18px rgba(var(--accent-rgb), .09);
    animation: popIn .55s cubic-bezier(.2, .8, .2, 1) backwards;
    transition: opacity .6s ease, transform .6s ease, border-color .5s, box-shadow .5s;
  }
  @keyframes popIn { from { opacity: 0; transform: translateY(-18px) scale(.97); } to { opacity: 1; transform: none; } }
  body.out .pop { opacity: 0; transform: translateY(-10px) scale(.985); }
  /* دخول المربع للمسبحة بالسحب: Pop صغير (يكبر لحظة) ثم يتصغّر ويتلاشى ناحية المسبحة، ومربع المسبحة بيعمل Pop وهو ظاهر */
  body.docking .pop { animation: popDock .46s cubic-bezier(.4, 0, .2, 1) forwards; pointer-events: none; }
  @keyframes popDock { 0% { transform: scale(1); opacity: 1; } 28% { transform: scale(1.045); opacity: 1; } 100% { transform: scale(.78); opacity: 0; } }

  /* ───── الإطار: يرسم محيط الإشعار كله بلون البراند ───── */
  .edge { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 5; display: none; }
  body.has-edge .edge { display: block; }
  .e-track { fill: none; stroke: rgba(var(--accent-rgb), .10); stroke-width: 2.5; }
  .e-prog {
    fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round;
    stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0;
    filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), .7));
  }
  .pop.success { border-color: rgba(var(--accent-rgb), .55); box-shadow: 0 8px 22px rgba(0,0,0,.42), 0 0 22px rgba(var(--accent-rgb), .30); }
  .pop.success .e-track { stroke: rgba(var(--accent-rgb), .30); }
  .pop.success .e-prog { animation: edgeFlash 1.1s ease-out; }
  @keyframes edgeFlash {
    0%   { filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), .7)); stroke-width: 2.5; }
    35%  { filter: drop-shadow(0 0 11px rgba(var(--accent-rgb), 1));  stroke-width: 3.5; }
    100% { filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), .75));  stroke-width: 2.5; }
  }
  .pop.fail .e-prog { stroke: var(--dim); filter: none; transition: stroke .6s; }

  .x {
    position: absolute; top: 10px; left: 12px; z-index: 6;
    width: 26px; height: 26px; border: none; border-radius: 50%;
    background: transparent; color: var(--dim);
    display: grid; place-items: center; transition: color .15s, background .15s;
  }
  .x:hover { color: var(--accent); background: rgba(var(--accent-rgb), .08); }
  .x svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

  section { display: none; }
  body[data-kind="verse"] #vVerse, body[data-kind="cards"] #vCards { display: block; }

  /* ───── الآية ───── */
  #vVerse { padding: 30px 26px 26px; text-align: center; }
  .vrow { display: flex; align-items: center; gap: 14px; }
  .vcol { flex: 1; min-width: 0; }
  .vico { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(var(--accent-rgb), .5); background: rgba(var(--accent-rgb), .08); box-shadow: 0 0 14px rgba(var(--accent-rgb), .25); color: var(--accent); }
  .vico[hidden] { display: none; }
  .vico svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .verse {
    font-family: var(--font-verse); font-size: 31px; line-height: 1.75; color: var(--text); text-wrap: balance;
    text-shadow: 0 0 20px rgba(var(--accent-rgb), .38);
    animation: verseIn 1.1s .15s ease-out backwards;
  }
  /* تنبيه مخصص: النص الطويل بيصغر شوية علشان يفضل متناسق جوه الإشعار */
  .verse.len-m { font-size: 26px; line-height: 1.7; }
  .verse.len-l { font-size: 22px; line-height: 1.75; }
  .verse.len-xl { font-size: 19px; line-height: 1.8; }
  .verse { overflow-wrap: anywhere; }
  @keyframes verseIn { from { opacity: 0; filter: blur(7px); } to { opacity: 1; filter: blur(0); } }   /* بدون letter-spacing: بيفكّ اتصال حروف العربي */
  .orn { margin: 12px auto 0; width: 120px; height: 10px; position: relative; opacity: .8; }
  .orn::before { content: ''; position: absolute; left: 0; right: 0; top: 4px; height: 1px;
                 background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), .7), transparent); }
  .orn::after { content: ''; position: absolute; left: 50%; top: 1px; width: 7px; height: 7px; margin-left: -3.5px;
                transform: rotate(45deg); background: var(--bg); border: 1px solid var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb), .6); }

  /* ───── البطاقات المخفية ───── */
  #vCards { padding: 18px 16px 14px; }
  .cap { text-align: center; font-size: 14px; color: var(--dim); height: 20px; transition: color .4s; }
  .pop.running .cap, .pop.success .cap { color: var(--accent); }
  .deck { display: flex; gap: 10px; height: 150px; margin-top: 12px; }
  .flip {
    flex: 1 1 0; min-width: 0; perspective: 800px; background: none; border: 0; padding: 0;
    transition: flex .6s cubic-bezier(.3, .7, .2, 1), opacity .45s, margin .6s cubic-bezier(.3, .7, .2, 1), transform .25s ease, filter .45s;
    animation: cardIn .6s cubic-bezier(.2, .8, .2, 1) backwards;
  }
  .flip:nth-child(1) { animation-delay: .20s; } .flip:nth-child(2) { animation-delay: .32s; } .flip:nth-child(3) { animation-delay: .44s; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.88); } to { opacity: 1; transform: none; } }
  body.picked .flip { animation: none; }
  .flip:not(.open):hover { transform: translateY(-5px); }
  .flip:active:not(.open) { transform: translateY(-2px) scale(.98); }
  body.picked .flip { pointer-events: none; }
  .flip.dim { opacity: .18; filter: blur(2px) grayscale(.6); transform: scale(.92); }
  .flip.gone { flex: 0 0 0; margin-inline: -5px; opacity: 0; }

  .fl-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.3, .75, .2, 1); }
  .flip.open .fl-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    display: grid; place-items: center;
  }
  .front {
    background: radial-gradient(120% 80% at 50% 0%, rgba(var(--accent-rgb), .16), transparent 62%), linear-gradient(160deg, #0e1812, #090f0b);
    border: 1px solid rgba(var(--accent-rgb), .30);
    box-shadow: 0 0 10px rgba(var(--accent-rgb), .10), inset 0 0 24px rgba(var(--accent-rgb), .06);
    transition: border-color .2s, box-shadow .2s;
  }
  .flip:hover .front { border-color: rgba(var(--accent-rgb), .7); box-shadow: 0 0 14px rgba(var(--accent-rgb), .26), inset 0 0 28px rgba(var(--accent-rgb), .10); }
  .front img { width: 100%; height: auto; display: block; pointer-events: none; filter: drop-shadow(0 0 7px rgba(var(--accent-rgb), .4)); animation: breathe 3.6s ease-in-out infinite; }
  .flip:nth-child(2) .front img { animation-delay: -1.2s; } .flip:nth-child(3) .front img { animation-delay: -2.4s; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.06); opacity: 1; } }
  .front::after {
    content: ''; position: absolute; inset: -30% -60%; pointer-events: none;
    background: linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, .12) 50%, transparent 58%);
    transform: translateX(-70%); animation: sweep 4.6s ease-in-out infinite;
  }
  .flip:nth-child(2) .front::after { animation-delay: .7s; } .flip:nth-child(3) .front::after { animation-delay: 1.4s; }
  @keyframes sweep { 0%, 55% { transform: translateX(-70%); } 100% { transform: translateX(70%); } }

  .back {
    transform: rotateY(180deg);
    background: radial-gradient(130% 90% at 50% 0%, rgba(var(--accent-rgb), .20), transparent 65%), #08100c;
    border: 1px solid rgba(var(--accent-rgb), .55);
    box-shadow: 0 0 12px rgba(var(--accent-rgb), .20), inset 0 0 26px rgba(var(--accent-rgb), .08);
    align-content: center; justify-items: center; gap: 8px; padding: 10px 12px; text-align: center;
  }
  .b-text { font-size: 20px; line-height: 1.35; color: var(--text); text-shadow: 0 0 14px rgba(var(--accent-rgb), .35); transition: font-size .5s ease; }
  .flip.chosen .b-text { font-size: 30px; }
  .b-n { min-height: 38px; display: grid; place-items: center; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(var(--accent-rgb), .4); }
  .b-n.bump { animation: bump .22s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .b-n svg { width: 38px; height: 38px; overflow: visible; }
  .chk-c { fill: rgba(var(--accent-rgb), .12); stroke: var(--accent); stroke-width: 2; filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), .7)); }
  .chk-p { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw .55s .15s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .pop.fail .back { border-color: var(--line); box-shadow: none; }
  .pop.fail .b-text, .pop.fail .b-n { opacity: .55; }

  .meta { margin-top: 12px; text-align: center; font-size: 12.5px; color: var(--dim); min-height: 18px; transition: color .4s; }
  .pop.success .meta { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .pop, .flip, .verse, .front img, .front::after { animation: none !important; }
    .fl-inner { transition-duration: .01s; }
  }
</style>
</head>
<body data-kind="">
  <div class="stage" id="stage">
    <div class="pop" id="pop">
      <svg class="edge" id="edge" aria-hidden="true">
        <path class="e-track" id="eTrack" pathLength="100"/>
        <path class="e-prog" id="eProg" pathLength="100"/>
      </svg>
      <button class="x" id="x" aria-label="إغلاق">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <section id="vVerse">
        <div class="vrow">
          <div class="vico" id="vIco" hidden></div>
          <div class="vcol">
            <div class="verse" id="verseText">أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</div>
            <div class="orn"></div>
          </div>
        </div>
      </section>

      <section id="vCards">
        <div class="cap" id="cap">اختر بطاقة</div>
        <div class="deck" id="deck"></div>
        <div class="meta" id="meta"></div>
      </section>
    </div>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const pop = $('pop'), stage = $('stage');
  let openAz = null;   // إشعار الصباح/المساء/النوم/الاستيقاظ: الضغط عليه يفتح الذكر مباشرة
  let openQuran = false;   // إشعار الورد: الضغط عليه يفتح القرآن عند آخر صفحة اتقرت
  const applyScale = z => { z = Number(z); if (!(z > 0)) z = 1; stage.style.transform = z === 1 ? '' : 'scale(' + z + ')'; requestAnimationFrame(() => fit()); };
  window.azkar.onPopupScale(applyScale);
  // ───── سحب الإشعار لأي مكان (من أي منطقة فاضية؛ الأزرار والبطاقات لسه بتشتغل كالمعتاد) ─────
  (() => {
    let d = null;
    document.addEventListener('pointerdown', e => {
      if (e.button !== 0 || d || e.target.closest('button')) return;
      d = { x: e.screenX, y: e.screenY, id: e.pointerId, moved: false, t: e.target };
      try { document.body.setPointerCapture(e.pointerId); } catch (_) {}
    });
    document.addEventListener('pointermove', e => {
      if (!d || e.pointerId !== d.id) return;
      if (!d.moved) {
        if (Math.abs(e.screenX - d.x) + Math.abs(e.screenY - d.y) < 4) return;       // عتبة صغيرة: نقرة عادية مش سحب
        d.moved = true; document.body.classList.add('dragging'); window.azkar.popupDragStart();
      }
      window.azkar.popupDragMove();
    });
    const end = e => {
      if (!d || (e && e.pointerId !== d.id)) return;
      const moved = d.moved, tgt = d.t; d = null; document.body.classList.remove('dragging');
      if (moved) window.azkar.popupDragEnd();
      else if (openAz && !closing && e && e.type === 'pointerup' && !(tgt && tgt.closest && tgt.closest('button'))) {
        const k = openAz; openAz = null;
        window.azkar.openSettings('daily:' + k);
        fadeAndClose(300, () => stopVerse(200));
      }
      else if (openQuran && !closing && e && e.type === 'pointerup' && !(tgt && tgt.closest && tgt.closest('button'))) {   // نقرة عادية على إشعار الورد
        openQuran = false;
        window.azkar.openSettings('quranread');
        fadeAndClose(300, () => stopVerse(200));
      }
    };
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);
    window.addEventListener('blur', () => end());
  })();
  const clamp01 = v => Math.min(1, Math.max(0, v));
  let cfg = null, vol = 0.5, rvol = 0.5, closing = false;   // vol: التحدي وغيره | rvol: صوت تنبيه الأذكار (الآية)

  // ───── الإغلاق بـ Fade Out ─────
  function fadeAndClose(ms = 650, extra) {
    if (closing) return;
    closing = true;
    if (extra) extra();
    document.body.classList.add('out');
    setTimeout(() => window.azkar.popupClose(), ms);
  }
  $('x').onclick = () => {
    if (pop.classList.contains('running')) return window.azkar.popupClose();   // أثناء التحدي: إلغاء فوري
    fadeAndClose(450, () => stopVerse(250));
  };

  // ───── ضبط ارتفاع النافذة على حجم المحتوى (علشان مفيش مساحة شفافة بتبلع الضغطات) ─────
  let fitT = null;
  const fit = () => { clearTimeout(fitT); fitT = setTimeout(() => window.azkar.popupFit(stage.getBoundingClientRect().height), 30); };
  new ResizeObserver(fit).observe(stage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  // ───── الإطار (حدود الإشعار نفسها = المؤقت) ─────
  const eTrack = $('eTrack'), eProg = $('eProg'), edge = $('edge');
  function layoutEdge() {
    const w = pop.offsetWidth, h = pop.offsetHeight, sw = 2.5, i = sw / 2;
    const r = (parseFloat(getComputedStyle(pop).borderTopLeftRadius) || 26) - i;
    const x0 = i, y0 = i, x1 = w - i, y1 = h - i, cx = w / 2;
    // يبدأ من منتصف الحافة العلوية ويلف في اتجاه عقارب الساعة حول الزوايا المقوّسة
    const d = `M${cx} ${y0} H${x1 - r} A${r} ${r} 0 0 1 ${x1} ${y0 + r} V${y1 - r} A${r} ${r} 0 0 1 ${x1 - r} ${y1} ` +
              `H${x0 + r} A${r} ${r} 0 0 1 ${x0} ${y1 - r} V${y0 + r} A${r} ${r} 0 0 1 ${x0 + r} ${y0} Z`;
    edge.setAttribute('viewBox', `0 0 ${w} ${h}`);
    eTrack.setAttribute('d', d); eProg.setAttribute('d', d);
  }
  new ResizeObserver(layoutEdge).observe(pop);
  const setProgress = p => { eProg.style.strokeDashoffset = String(100 * (1 - p)); eProg.style.opacity = p > 0.002 ? '1' : '0'; };

  let raf = 0, frozen = false, startsAt = 0, durMs = 60000;
  function startEdge(at, dur) {
    startsAt = at; durMs = dur; frozen = false;
    document.body.classList.add('has-edge');
    layoutEdge(); setProgress(0);
    const loop = () => {
      if (frozen) return;
      setProgress(clamp01((Date.now() - startsAt) / durMs));       // 0% → 100% خلال 60 ثانية بالظبط
      raf = requestAnimationFrame(loop);
    };
    loop();
  }
  function freezeEdge(toFull) {
    frozen = true; cancelAnimationFrame(raf);
    if (toFull) { eProg.style.transition = 'stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)'; setProgress(1); }
  }

  // ───── الصوت ─────
  let verseAudio = null, verseStop = false;
  function stopVerse(ms) {
    if (!verseAudio || verseStop) return;
    verseStop = true;
    const a = verseAudio, v0 = a.volume, t0 = performance.now();
    const step = () => { const k = (performance.now() - t0) / ms; if (k >= 1) { a.pause(); return; } a.volume = v0 * (1 - k); requestAnimationFrame(step); };
    step();
  }
  // play() غير حاجب + محاولة تانية (بعد load) لو فشل: علشان الصوت ما "يعلقش" بعد أول فشل
  function safePlay(a) {
    if (!a) return;
    const p = a.play();
    if (p && p.catch) p.catch(() => {
      try { a.load(); } catch (_) {}
      setTimeout(() => { try { const q = a.play(); if (q && q.catch) q.catch(() => {}); } catch (_) {} }, 120);
    });
  }
  function playChime() {
    if (!cfg.audio.challenge || vol <= 0) return;
    const a = new Audio(cfg.audio.challenge); a.volume = clamp01(vol); safePlay(a);
  }

  // "بارك الله فيك" (Completion.*): بعد نجاح التحدي فقط، فوق صوت الإنجاز الحالي بعد لحظة قصيرة. بترجّع وقت انتهائه التقريبي (ms)
  let blessAudio = null;
  function playBlessing(delay) {
    if (!blessAudio || vol <= 0) return 0;
    blessAudio.volume = clamp01(vol); blessAudio.currentTime = 0;
    setTimeout(() => { if (!closing) safePlay(blessAudio); }, delay);
    return delay + (isFinite(blessAudio.duration) && blessAudio.duration > 0 ? blessAudio.duration * 1000 : 2200);
  }

  // صوت المرور على البطاقة: مرة واحدة عند الدخول (pointerenter مش بيتكرر مع حركة الماوس جوه نفس البطاقة)
  let hoverAudio = null, lastHover = 0;
  function playHover() {
    if (!hoverAudio || vol <= 0) return;
    const n = performance.now();
    if (n - lastHover < 120) return;                                       // حماية من ارتداد الحدود بين بطاقتين
    lastHover = n;
    hoverAudio.volume = clamp01(vol * 0.6); hoverAudio.currentTime = 0;
    safePlay(hoverAudio);
  }

  // ───── 1) الآية + الصوت (Fade Out في آخر 4 ثواني) ─────
  const FADE_SEC = 4;
  const VERSES = [
    'أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ',
    'فَسُبۡحَٰنَ ٱللَّهِ حِينَ تُمۡسُونَ وَحِينَ تُصۡبِحُونَ'
  ];
  function runVerse() {
    document.body.dataset.kind = 'verse';
    const custom = cfg.custom && cfg.custom.text ? cfg.custom : null;      // تنبيه مخصص (نص المستخدم + صوت اختياري)
    const idx = cfg.verse === 1 ? 1 : 0;                                  // الـ main بيختار الآية عشوائيًا
    const vt = $('verseText');
    const ICO = {   // أيقونة جنب النص: شمس للصباح، هلال للمساء، مصحف للورد، سرير للنوم، شروق للاستيقاظ
      m: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>',
      e: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
      w: '<svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>',
      sl: '<svg viewBox="0 0 24 24"><path d="M3 18v-9"/><path d="M3 15h18v3"/><path d="M21 15v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="12" r="1.8"/></svg>',
      wk: '<svg viewBox="0 0 24 24"><path d="M3 18h18"/><path d="M6 18a6 6 0 0 1 12 0"/><path d="M12 5v3M4.5 9l2 2M19.5 9l-2 2"/></svg>',
      ad: '<svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 20v-5a6 6 0 0 1 12 0v5"/><path d="M12 9V5M10.5 6.5h3"/></svg>',
      ws: '<svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>',
      bd: '<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M9 13.5L7 21l5-3 5 3-2-7.5"/></svg>',
      up: '<svg viewBox="0 0 24 24"><path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>'
    };
    if (custom && custom.grp === 'wird') { openQuran = true; document.body.style.cursor = 'pointer'; }
    if (custom && ['m', 'e', 'sl', 'wk'].includes(custom.ico)) { openAz = custom.ico; document.body.style.cursor = 'pointer'; }
    if (custom && ICO[custom.ico]) { $('vIco').innerHTML = ICO[custom.ico]; $('vIco').hidden = false; }
    if (custom) {
      vt.textContent = custom.text;                                       // textContent: نص المستخدم ما بيتفسّرش HTML أبدًا
      const n = [...custom.text].length;
      if (n > 28) vt.classList.add(n > 100 ? 'len-xl' : n > 60 ? 'len-l' : 'len-m');   // أسماء مميزة (len-*): اسم قصير زي 'x' بيتصادم مع .x بتاع زرار الإغلاق
    } else vt.textContent = VERSES[idx];
    const src = custom ? custom.src : (idx === 1 ? cfg.audio.reminder2 : cfg.audio.reminder);
    const capMs = (cfg.capSec || 45) * 1000;                              // سقف تشغيل الصوت المخصص (ملف طويل / بث بدون نهاية)
    const readMs = custom ? Math.min(18000, 5500 + [...custom.text].length * 80) : 7500;   // بدون صوت: وقت قراءة على قد النص
    const fallback = setTimeout(() => fadeAndClose(650), readMs);        // لو الصوت اتقفل/مش موجود/ما بدأش
    if (!src || cfg.reminderSound === false) return;                     // صوت التنبيه متقفل من الإعدادات (أو مفيش صوت): النص يظهر بدون صوت
    const a = verseAudio = new Audio(src);
    a.preload = 'auto';
    a.volume = clamp01(rvol);
    let started = false, guard = null;
    const finish = () => { clearTimeout(fallback); clearTimeout(guard); if (closing) return; closing = true; window.azkar.popupClose(); };
    // مدة التشغيل الفعلية: المخصص بيتحدد بسقف (وللبث اللي مالوش مدة = السقف نفسه)
    const playLen = () => {
      const d = a.duration;
      if (!custom) return (isFinite(d) && d > 0) ? d : 0;
      return (isFinite(d) && d > 0) ? Math.min(d, capMs / 1000) : capMs / 1000;
    };
    // حارس: لو الصوت بدأ ومخلصش في مدته + هامش (decoder وقف مثلًا) الإشعار يتقفل بدل ما يفضل معلّق
    const arm = () => { clearTimeout(guard); const L = playLen(); guard = setTimeout(finish, (L > 0 ? L * 1000 : 20000) + 3000); };
    const loop = () => {
      if (closing || verseStop) return;
      const d = playLen(), t = a.currentTime;
      if (d > 0) {
        const left = Math.max(0, d - t);
        const f = left >= FADE_SEC ? 1 : Math.sin((left / FADE_SEC) * Math.PI / 2);   // منحنى ناعم (بيبدأ وبينتهي بهدوء)
        a.volume = clamp01(rvol * f);
        if (left < 1.1) { pop.style.opacity = String(clamp01(left / 1.1)); }          // الإشعار نفسه بيختفي مع آخر ثانية
        if (custom && left <= 0.05) { a.pause(); return finish(); }                   // وصل للسقف قبل نهاية الملف
      }
      requestAnimationFrame(loop);
    };
    a.addEventListener('ended', finish);
    a.addEventListener('loadedmetadata', () => { if (started) arm(); });
    a.addEventListener('error', () => { clearTimeout(guard); });                      // الـ fallback هو اللي هيقفل الإشعار
    const tryPlay = retried => {
      const p = a.play();
      if (!p || !p.then) return;
      p.then(() => { started = true; clearTimeout(fallback); arm(); requestAnimationFrame(loop); })
       .catch(() => { if (!retried && !closing) { try { a.load(); } catch (_) {} setTimeout(() => tryPlay(true), 150); } });
    };
    tryPlay(false);
  }

  // ───── 2) البطاقات المخفية → التحدي ─────
  let phase = 'choose', chosenEl = null, cards = [];
  function runCards() {
    document.body.dataset.kind = 'cards';
    const deck = $('deck');
    if (cfg.audio.hover) { hoverAudio = new Audio(cfg.audio.hover); hoverAudio.preload = 'auto'; hoverAudio.onerror = () => { hoverAudio = null; }; }
    if (cfg.audio.done)  { blessAudio = new Audio(cfg.audio.done);  blessAudio.preload = 'auto'; blessAudio.onerror = () => { blessAudio = null; }; }
    for (let i = 0; i < cfg.cards; i++) {
      const b = document.createElement('button');
      b.className = 'flip'; b.dataset.i = i; b.setAttribute('aria-label', 'بطاقة مخفية ' + (i + 1));
      // الوجه الأمامي: اللوجو هو العنصر الأساسي فقط (مفيش أي نص بيكشف التحدي)
      b.innerHTML = '<div class="fl-inner"><div class="face front"><img src="assets/logo.png" alt=""></div>' +
                    '<div class="face back"><div class="b-text"></div><div class="b-n"></div></div></div>';
      b.addEventListener('pointerenter', () => { if (phase === 'choose') playHover(); });
      b.onclick = () => {
        if (phase !== 'choose') return;
        phase = 'picking'; document.body.classList.add('picked');
        window.azkar.popupPick(i);
      };
      deck.appendChild(b); cards.push(b);
    }
    setTimeout(() => { if (phase === 'choose') fadeAndClose(650); }, 45000);   // ما اتفتحتش: الإشعار يختفي
  }

  if (window.azkar.onPopupDocking) window.azkar.onPopupDocking(() => document.body.classList.add('docking'));
  window.azkar.onPopupReveal(({ index, text, need, startsAt: at, durationMs }) => {
    phase = 'running';
    document.body.classList.add('picked');
    chosenEl = cards[index];
    chosenEl.querySelector('.b-text').textContent = text;
    chosenEl.querySelector('.b-n').textContent = '0 / ' + need;
    chosenEl.classList.add('open');
    pop.classList.add('running');
    cards.forEach((c, i) => { if (i !== index) setTimeout(() => c.classList.add('dim'), 250); });
    setTimeout(() => { cards.forEach((c, i) => { if (i !== index) c.classList.add('gone'); }); chosenEl.classList.add('chosen'); }, 800);   // البطاقة تتمدد ثم الخط يكبر
    $('cap').textContent = 'سبّح بعجلة الماوس';
    $('meta').textContent = 'أكمل العدد قبل أن يكتمل الإطار';
    startEdge(at, durationMs);
    setTimeout(layoutEdge, 900);
  });
  window.azkar.onPopupTick(({ done, need }) => {
    if (!chosenEl) return;
    const n = chosenEl.querySelector('.b-n');
    n.textContent = done + ' / ' + need;
    n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump');
  });
  window.azkar.onPopupSuccess(() => {
    phase = 'success';
    freezeEdge(true);
    pop.classList.remove('running'); pop.classList.add('success');
    if (chosenEl) chosenEl.querySelector('.b-n').innerHTML =
      '<svg viewBox="0 0 40 40" aria-label="تم"><circle class="chk-c" cx="20" cy="20" r="18"/><path class="chk-p" d="M11.5 20.5l6 6 11-12.5"/></svg>';
    $('cap').textContent = 'تم الإنجاز';
    $('meta').textContent = 'بارك الله فيك';
    playChime();
    const endMs = playBlessing(500);                                      // "بارك الله فيك" بعد نص ثانية من صوت الإنجاز
    setTimeout(() => fadeAndClose(700), Math.max(4200, endMs + 600));    // الإشعار ما يتقفلش قبل ما الصوت يخلص
  });
  window.azkar.onPopupFail(() => {
    phase = 'fail';
    freezeEdge(false); setProgress(1);
    pop.classList.remove('running'); pop.classList.add('fail');
    $('cap').textContent = 'انتهى الوقت';
    $('meta').textContent = 'جرّب في المرة القادمة';
    setTimeout(() => fadeAndClose(700), 3000);
  });

  window.azkar.onState(s => {
    if (!s) return;
    if (Number.isFinite(s.popupVolume)) vol = s.popupVolume;
    // مستوى صوت الإشعار الحالي بيتحدّث من مجموعته هو (الأذان/أذكار الصباح والمساء/الورد)، مش من صوت تنبيه الأذكار العام،
    // وإلا أي تحديث للحالة (زي الضغط على الإشعار) كان بيوطّي الصوت وهو شغّال.
    const g = cfg && cfg.custom && cfg.custom.grp;
    const key = g === 'pray' ? 'prayerVolume' : g === 'az' ? 'azVolume' : g === 'wird' ? 'wirdVolume' : 'reminderVolume';
    if (Number.isFinite(s[key])) rvol = s[key];
  });

  window.azkar.popupGet().then(c => {
    if (!c) return window.azkar.popupClose();
    applyScale(c.scale);
    cfg = c; vol = c.popupVolume; rvol = Number.isFinite(c.reminderVolume) ? c.reminderVolume : vol;
    if (c.kind === 'cards') runCards(); else runVerse();
    requestAnimationFrame(fit);
  });
})();
</script>
</body>
</html>
