<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' file: 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
<title>WZAKER</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* نفس الـ keyframes بتتحكم فيها متغيرات قابلة للتحريك (Chromium 85+) */
  @property --p { syntax: '<percentage>'; inherits: false; initial-value: 0%; }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body { display: grid; place-items: center; user-select: none; -webkit-user-select: none; }

  .stage { position: relative; width: 640px; height: 420px; display: grid; place-items: center; }
  .stage.out { animation: out .95s cubic-bezier(.5, 0, .8, .4) forwards; }
  @keyframes out { to { opacity: 0; transform: scale(1.07); filter: blur(7px); } }

  /* خلفية غامقة ناعمة: علشان اللوجو يبان على أي خلفية سطح مكتب */
  .halo {
    position: absolute; width: 600px; height: 380px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(9, 15, 11, .80) 0%, rgba(9, 15, 11, .66) 38%, rgba(9, 15, 11, .30) 70%, rgba(9, 15, 11, 0) 100%);
    opacity: 0; animation: haloIn 1.1s ease-out .05s forwards;
  }
  @keyframes haloIn { to { opacity: 1; } }

  /* وهج بلون البراند بينبض مرة واحدة */
  .aura {
    position: absolute; width: 360px; height: 215px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(var(--accent-rgb), .24), rgba(var(--accent-rgb), 0) 82%);
    opacity: 0; transform: scale(.55); filter: blur(8px);
    animation: aura 3.6s cubic-bezier(.3, .1, .2, 1) .1s forwards;
  }
  @keyframes aura { 0% { opacity: 0; transform: scale(.6); } 50% { opacity: .62; transform: scale(1.03); } 100% { opacity: .24; transform: scale(1); } }

  .logo-wrap { position: relative; width: 440px; aspect-ratio: 980 / 615; }
  .logo {
    display: block; width: 100%; height: 100%;
    /* كتابة الخط: الكشف بيبدأ من اليمين ويمشي للشمال (اتجاه الكتابة العربية) */
    --p: 0%;
    -webkit-mask-image: linear-gradient(270deg, #000 calc(var(--p) - 38%), transparent var(--p));
            mask-image: linear-gradient(270deg, #000 calc(var(--p) - 38%), transparent var(--p));
    animation: write 2.2s cubic-bezier(.45, .05, .2, 1) .25s forwards, glow 3.2s ease-in-out 2.5s infinite;
    filter: blur(10px) drop-shadow(0 0 0 rgba(var(--accent-rgb), 0));
  }
  @keyframes write {
    0%   { --p: 0%;   transform: translateY(7px) scale(.95); filter: blur(12px) drop-shadow(0 0 0 rgba(var(--accent-rgb), 0)); }
    55%  { filter: blur(3px) drop-shadow(0 0 10px rgba(var(--accent-rgb), .32)); }
    100% { --p: 142%; transform: translateY(0) scale(1);     filter: blur(0)    drop-shadow(0 0 6px rgba(var(--accent-rgb), .28)); }
  }
  @keyframes glow {
    0%, 100% { filter: blur(0) drop-shadow(0 0 5px rgba(var(--accent-rgb), .20)); }
    50%      { filter: blur(0) drop-shadow(0 0 9px rgba(var(--accent-rgb), .34)); }
  }

  /* لمعة بتعدّي على شكل اللوجو بس: نسخة تانية من اللوجو أفتح، ظاهر منها شريط مائل متحرك (Gradient mask)
     (مش بنستخدم mask: url() لأنه بيتحجب بـ CORS على ملفات file://) */
  @property --s { syntax: '<percentage>'; inherits: false; initial-value: -30%; }
  .shine {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; opacity: 0;
    --s: -30%;
    filter: brightness(3.4) saturate(0);
    -webkit-mask-image: linear-gradient(115deg, transparent calc(var(--s) - 18%), #000 var(--s), transparent calc(var(--s) + 18%));
            mask-image: linear-gradient(115deg, transparent calc(var(--s) - 18%), #000 var(--s), transparent calc(var(--s) + 18%));
    animation: shine 1.7s cubic-bezier(.45, .05, .25, 1) 2.05s forwards;
  }
  @keyframes shine { 0% { --s: 130%; opacity: 0; } 15% { opacity: .85; } 85% { opacity: .85; } 100% { --s: -30%; opacity: 0; } }

  /* ذرات خضرا ناعمة: بتظهر مكان كشف اللوجو (من اليمين للشمال) وبتطفو لفوق بحركة متعرّجة هادية وبتتلاشى */
  .mote { position: absolute; left: 0; top: 0; width: var(--sz); height: var(--sz); border-radius: 50%; opacity: 0; pointer-events: none;
          background: radial-gradient(circle, rgba(var(--accent-rgb), .95) 0%, rgba(var(--accent-rgb), .45) 45%, rgba(var(--accent-rgb), 0) 72%);
          filter: blur(var(--bl)); will-change: transform, opacity;
          animation: mote var(--dur) cubic-bezier(.3, .1, .25, 1) var(--dl) forwards; }
  @keyframes mote {
    0%   { opacity: 0;           transform: translate3d(var(--x0), var(--y0), 0) scale(.4); }
    22%  { opacity: var(--op); }
    50%  {                       transform: translate3d(calc(var(--x0) + var(--dx) * .45 + var(--sw)), calc(var(--y0) + var(--dy) * .5), 0) scale(1); }
    78%  { opacity: calc(var(--op) * .7); }
    100% { opacity: 0;           transform: translate3d(calc(var(--x0) + var(--dx) - var(--sw) * .6), calc(var(--y0) + var(--dy)), 0) scale(.7); }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; -webkit-mask-image: none; mask-image: none; filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), .28)); }
    .shine, .mote, .aura { display: none; }
    .halo { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="halo"></div>
    <div class="aura"></div>
    <div class="logo-wrap" id="wrap">
      <img class="logo" src="assets/logo.png" alt="WZAKER">
      <img class="shine" src="assets/logo.png" alt="">
    </div>
  </div>
<script>
(() => {
  const stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
  // ذرات خضرا ناعمة بتطلع من مكان كشف اللوجو وهو بيتكتب (من اليمين للشمال) وبتطفو لفوق بحركة متعرّجة هادية
  const W = wrap.offsetWidth, H = wrap.offsetHeight, WRITE_AT = .25, WRITE_DUR = 2.2;
  for (let i = 0; i < 38; i++) {
    const m = document.createElement('i');
    m.className = 'mote';
    const fx = Math.random() * .9 + .05, big = Math.random() < .22;            // fx: مكان الذرة أفقيًا (0 يمين اللوجو ... 1 شماله بعد الاتجاه)
    const sz = big ? 13 + Math.random() * 10 : 5 + Math.random() * 5;
    const x = (1 - fx) * W, y = (Math.random() * .7 + .15) * H;                 // من اليمين للشمال زي كتابة العربي
    m.style.setProperty('--sz', sz.toFixed(1) + 'px');
    m.style.setProperty('--x0', (x - sz / 2).toFixed(1) + 'px'); m.style.setProperty('--y0', (y - sz / 2).toFixed(1) + 'px');
    m.style.setProperty('--dx', (Math.random() * 36 - 18).toFixed(1) + 'px'); m.style.setProperty('--dy', (-(Math.random() * 54 + 22)).toFixed(1) + 'px');
    m.style.setProperty('--sw', ((Math.random() < .5 ? -1 : 1) * (6 + Math.random() * 12)).toFixed(1) + 'px');
    m.style.setProperty('--bl', (big ? 1.6 : .35 + Math.random() * .5).toFixed(2) + 'px');
    m.style.setProperty('--op', (big ? .3 + Math.random() * .2 : .7 + Math.random() * .3).toFixed(2));
    m.style.setProperty('--dur', (3 + Math.random() * 1.8).toFixed(2) + 's');
    m.style.setProperty('--dl', (WRITE_AT + fx * WRITE_DUR * .78 + Math.random() * .35).toFixed(2) + 's');   // بتظهر وقت ما الكشف يوصل لمكانها
    wrap.appendChild(m);
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_FADE = reduce ? 1200 : 3700, T_FADE_MS = 950;
  // الـ Fade Out ما بيبدأش قبل ما صوت التشغيل يخلص (الـ main هو اللي بيدّي الإشارة)، علشان الكلام ما يتقطعش
  let faded = false;
  const go = () => {
    if (faded) return; faded = true;
    stage.classList.add('out'); window.azkar.splashPhase('fade');   // الدايل بيظهر مع بداية الـ Fade
    setTimeout(() => window.azkar.splashPhase('done'), T_FADE_MS + 60);
  };
  if (window.azkar.onSplashGo) window.azkar.onSplashGo(go);
  setTimeout(() => window.azkar.splashPhase('ready'), T_FADE);     // الإنميشن خلص: الـ main يرد بـ splash:go
  setTimeout(go, T_FADE + 6000);                                   // شبكة أمان لو الرد ما وصلش
})();
</script>
</body>
</html>
