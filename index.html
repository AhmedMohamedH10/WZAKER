<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' file: 'unsafe-inline'; script-src 'self' file: 'unsafe-inline'; media-src 'self' file:; font-src 'self' file:; img-src 'self' file: data:">
<title>WZAKER</title>
<link rel="stylesheet" href="theme.css">
<script src="layout.js"></script>
<script src="firstword.js" defer></script>
<style>
  /* الخط: دايمًا من الملف المرفق داخل assets/fonts/ (من غير local() علشان نسخة تانية على الجهاز ما تغيّرش الشكل/الوزن) */
  @font-face {
    font-family: 'Hail Elastic Light 1';
    src: url('assets/fonts/HailElasticLight1.ttf') format('truetype');
    font-weight: 100 900;      /* الخط بوزن واحد: بنعلن إنه بيغطي كل الأوزان علشان المتصفح ما يعملش Bold مصطنع */
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Inter';
    src: url('assets/fonts/Inter-VariableFont_opsz_wght.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0041-005A, U+0061-007A;   /* حروف إنجليزي بس: الأرقام والرموز بتفضل بخط Hail الأصلي في المسبحة */
  }
  @font-face {
    font-family: 'Hail Elastic Plain';
    src: url('assets/fonts/HailElasticLight.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
  }


  * { box-sizing: border-box; margin: 0; }
  /* --gm: هامش شفاف حول الكارت لاحتواء الـ Glow بالكامل. لازم يساوي GLOW في main.js. أي Glow أكبر منه كان بيتقص عند حافة النافذة */
  :root { --gm: 18px; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: var(--font-main);
    color: var(--text);
    user-select: none; -webkit-user-select: none; cursor: default;
  }

  .card {
    position: fixed; left: var(--gm); top: var(--gm); width: 258px; height: 354px;   /* لازم = CARD_FULL في main.js */
    transform-origin: 0 0; transform: scale(var(--ks, 1));                          /* "حجم المسبحة كلها" (تخصيص المسبحة): النافذة بتكبر بنفس النسبة */
    border-radius: 30px; overflow: hidden;                                         /* أي عنصر مكبّر مايخرجش بره حدود المسبحة */
    background: var(--bg);
    border: 1px solid var(--line);
    box-shadow: 0 0 14px rgba(var(--accent-rgb), .09);
    display: flex; flex-direction: column; align-items: center;
    padding: 9px 13px 13px;
  }

  .card, .mini { transition: opacity .25s ease; }
  /* الماوس خارج النافذة: تخفت بهدوء (بعد مهلة قصيرة) وترجع بسرعة. مش بتشتغل أثناء التحدي */
  body.idle:not(.is-mini):not(.is-challenge) .card { opacity: var(--idle-op, 1); transition: opacity .9s ease .8s; }
  body.idle.is-mini:not(.is-challenge) .mini { opacity: min(var(--mini-op, .85), var(--idle-op, 1)); transition: opacity .9s ease .8s; }
  @media (prefers-reduced-motion: reduce) { .card, .mini, body.idle .card, body.idle .mini { transition: none !important; } }

  /* ═════ دخول المسبحة عند بدء التشغيل (بيبدأ قبل نهاية صوت "فسبحان الله" بحوالي ثانية وربع) ═════
     الكارت: تلاشي + تكبير هادي من المنتصف + طفو بسيط + نبضة توهّج واحدة. المحتوى جواه بيظهر ورا بعضه (stagger).
     pre-show = مخفية لحد ما النافذة تظهر فعلًا. بنحرّك opacity والخصائص الفردية translate/scale بس، فمفيش تعارض مع
     transform بتاع حجم المسبحة (--ks). مفيش to/100%: الأنيميشن بيخلص عند القيمة العادية (بما فيها شفافية الـ idle) من غير قفزة. */
  body.pre-show .card, body.pre-show .mini { opacity: 0 !important; transition: none !important; }
  body.enter .card { animation: dialRise 1.5s cubic-bezier(.22, 1, .36, 1) backwards, dialFade 1.0s ease-out backwards, dialGlow 2.1s ease-in-out backwards; }
  body.enter .mini { animation: miniRise 1.2s cubic-bezier(.22, 1, .36, 1) backwards, dialFade .8s ease-out backwards, dialGlow 1.8s ease-in-out backwards; }
  body.enter .card > .top, body.enter .card > .dial, body.enter .card > .dhikr, body.enter .card > .totrow, body.enter .card > .ctrl {
    animation: partIn .95s cubic-bezier(.22, 1, .36, 1) backwards;
  }
  body.enter .card > .top    { animation-delay: .10s; }
  body.enter .card > .dial   { animation-delay: .18s; animation-duration: 1.25s; }
  body.enter .card > .dhikr  { animation-delay: .34s; }
  body.enter .card > .totrow { animation-delay: .42s; }
  body.enter .card > .ctrl   { animation-delay: .50s; }
  @keyframes dialRise {      /* transform-origin بتاع الكارت 0 0، فالـ translate بيعوّض التكبير علشان يتكبّر من المنتصف */
    from { scale: .94; translate: calc(258px * var(--ks, 1) * .03) calc(354px * var(--ks, 1) * .03 + 10px); }
  }
  @keyframes miniRise { from { scale: .95; translate: 0 8px; } }
  @keyframes dialFade { from { opacity: 0; } }
  @keyframes partIn   { from { opacity: 0; translate: 0 9px; } }
  @keyframes dialGlow {
    from { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); }
    50%  { box-shadow: 0 0 16px 0 rgba(var(--accent-rgb), .30); }
  }
  @media (prefers-reduced-motion: reduce) {
    body.enter .card, body.enter .mini { animation: dialFade .35s ease-out backwards; }
    body.enter .card > * { animation: none; }
  }

  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 1px solid var(--accent); }

  /* الشريط العلوي */
  .top { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 33px; }
  .top .tl { display: flex; justify-self: start; }
  .top .tr { justify-self: end; }
  .ibtn {
    width: 28px; height: 28px; border: none; border-radius: 50%;
    background: transparent; color: var(--dim);
    display: grid; place-items: center; transition: color .15s, background .15s;
  }
  .ibtn:hover { color: var(--accent); background: rgba(var(--accent-rgb), .08); }
  .ibtn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  /* Header: اللوجو في المنتصف (وهو نفسه مقبض السحب) + سطر صغير تحته */
  .grip { width: 108px; height: 33px; display: grid; place-items: center; cursor: pointer; border-radius: 12px; transition: background .15s; }
  .grip:hover { background: rgba(var(--accent-rgb), .06); }
  .grip:active { cursor: grabbing; }
  .brand { height: 35px; width: auto; display: block; pointer-events: none; -webkit-user-drag: none; opacity: .95; }
  .tagline {
    width: 100%; margin-top: -1px; height: 15px; padding: 0 6px; text-align: center;
    translate: 0 7px;                                   /* المسافة بين اللوجو والآية = 39 بكسل (ثابتة: مش من التخصيص) */
    font-size: 11px; line-height: 15px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
  }

  /* العدّاد */
  .dial { position: relative; width: 184px; height: 184px; margin-top: 3px; pointer-events: none; }
  .dial[data-hit] { pointer-events: auto; cursor: pointer; border-radius: 50%; -webkit-tap-highlight-color: transparent; }   /* التسبيح بالنقر مفعّل */
  .dial svg { position: absolute; inset: 0; transform: rotate(-90deg); overflow: visible; }
  .track { fill: none; stroke: rgba(var(--accent-rgb), .09); stroke-width: 7; }
  .bar {
    fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round;
    stroke-dasharray: 465; stroke-dashoffset: 465;
    transition: stroke-dashoffset .18s ease-out;
    filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), .5));
  }
  /* شريط التقدّم في الدايرة العادية: انسيابية ناعمة + لمعة بتجري + رأس مضيء + توهج بيتنفّس قرب الهدف (الحبات والخرز على الحبل مش متأثرين) */
  .halo-w, .shine, .head { display: none; }
  .dial:not(.beads):not(.strand) .bar { transition: stroke-dashoffset var(--glide, .65s cubic-bezier(.22, 1, .36, 1)); }
  .dial:not(.beads):not(.strand) .halo-w { display: inline; opacity: 0; transition: opacity .8s ease; }
  .halo { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; stroke-dasharray: 465; stroke-dashoffset: 465; filter: blur(3.5px);
    transition: stroke-dashoffset var(--glide, .65s cubic-bezier(.22, 1, .36, 1)); animation: haloBreath var(--bp, 2.8s) ease-in-out infinite; }
  /* حلقة التقدّم السميكة: ضوء بيجري جوّه الجزء المتملّي + موجة عند رأس القوس + انفجار ناعم عند الإتمام */
  .flow-w, .burst, .hrip { display: none; }
  .dial:not(.beads):not(.strand) .flow-w { display: inline; }
  .flow { fill: none; stroke: rgba(240, 255, 247, .5); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 10 38; animation: flowMove 2.6s linear infinite; }
  @keyframes flowMove { to { stroke-dashoffset: -48; } }
  #maskBar { transition: stroke-dashoffset var(--glide, .65s cubic-bezier(.22, 1, .36, 1)); }
  .dial:not(.beads):not(.strand) .burst { display: inline; fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; transform-origin: 88px 88px; }
  .dial:not(.beads):not(.strand) .hrip { display: inline; fill: none; stroke: #eafff4; stroke-width: 1.6; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .hrip { filter: none !important; animation: none !important; }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } #maskBar { transition: none; } }
  @keyframes haloBreath { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  .dial:not(.beads):not(.strand) .shine { display: inline; fill: none; stroke: #f0fff7; stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 24 441; stroke-dashoffset: 0; opacity: 0;
    filter: drop-shadow(0 0 3px rgba(var(--accent-rgb), .9)); }
  .dial:not(.beads):not(.strand) .head { display: inline; opacity: 0; transform-origin: 88px 88px; transform: rotate(0deg);
    transition: transform var(--glide, .65s cubic-bezier(.22, 1, .36, 1)), opacity .4s ease; }
  .rew { display: none; opacity: 0; transform-origin: 88px 88px; pointer-events: none; }
  .dial.beads .rew { display: inline; }
  .rew circle { fill: #eafff4; filter: drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 9px rgba(var(--accent-rgb), .85)); }   /* شرارة بتنسحب مع الخط المنوّر وهو راجع */
  .head circle { fill: #eafff4; filter: drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 7px rgba(var(--accent-rgb), .7)); animation: headBreath 2.2s ease-in-out infinite; }
  @keyframes headBreath { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .halo, .head circle { animation: none; } .dial:not(.beads):not(.strand) .bar, .halo, .dial:not(.beads):not(.strand) .head { transition: none; } }
  /* شكل العدّاد "حبات سبحة": الحبات بتلف بأنيميشن والعدّاد في النص زي ما هو */
  .dial .bsvg { display: none; transform: none; pointer-events: none; }
  .dial.beads .bsvg { display: block; }
  .dial.beads .track, .dial.beads .bar { transform-origin: 88px 88px; transform: scale(1.13); stroke-width: 2; }   /* قوس التقدّم برّه الحبات */
  .dial.beads .num { font-size: calc(70px * var(--nk, 1)); position: relative; top: var(--nfy, 0px); left: var(--nfx, 0px); }   /* --nfy/--nfx: تصحيح تلقائي من layout.js يخلّي شكل الرقم نفسه (مش صندوق الخط) في نص الدايرة */
  .dial.beads .bar { transition: stroke-dashoffset var(--glide, .65s cubic-bezier(.22, 1, .36, 1)); }   /* قوس التقدّم في الحبات بيتحرك ويرجع بانسيابية زي الدايرة العادية */
  .dial.beads .readout { place-content: center; }
  .dial.beads .of { top: calc(50% + 39px); }
  .dial.beads[data-hit] { cursor: default; }
  .dial.beads .bd { pointer-events: auto; cursor: pointer; }
  .dial.beads .readout { pointer-events: none; }   /* الأرقام ما تغطيش الحبات */
  /* شكل "خرز على الحبل": خرزات كبيرة على دايرة العدّاد نفسها، والدايرة هي الحبل */
  .dial .ssvg { display: none; transform: none; pointer-events: none; }
  .dial.strand .ssvg { display: block; }
  .dial .rope { display: none; }
  .dial.strand .rope { display: inline; }   /* الحبل المفتول: بيظهر في شكل الخرز على الحبل بس */
  .dial.strand .track { stroke: none; }   /* الحبل الجديد بدل الخط القديم */
  .dial.strand .bar { stroke-width: 1.3; }   /* قوس التقدّم خيط مضيء رفيع فوق الحبل (من غير ما يخبّي الفتل) */
    /* رقم العدّاد في نص دايرة الخرز بالظبط: سطر الهدف (/ 100) خارج الترتيب فمايزحّش الرقم لفوق */
  .dial.strand .readout { place-content: center; }
  .dial.strand .num { font-size: calc(74px * var(--nk, 1)); }   /* الرقم في منتصف الدايرة بالظبط: التصحيح بيتحسب تلقائي حسب الخط (layout.js) وتخصيص المسبحة بيتطبّق فوقه */
  .dial.strand .of { top: calc(50% + 41px); }
  .dial.strand[data-hit] { cursor: default; }
  .dial.strand .sb { pointer-events: auto; cursor: pointer; }
  .dial.strand .sb .hl, .dial.strand .sb .cr { transition: opacity .5s ease; }   /* توهّج الخرزة الحالية/المعدودة بيتغيّر بنعومة */
  .dial.strand .readout { pointer-events: none; }
  .ssvg .hl, .ssvg .cr { transition: opacity .25s ease; }
  /* إعداد التوهّج: مقفول = الحبات مطفية (من غير هالة ولا حواف مضيئة) */
  .dial:not(.glow) .gl { display: none; }
  .dial.beads:not(.glow) .bar, .dial.strand:not(.glow) .bar { filter: none; }
  .readout { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .num {
    font-size: calc(73px * var(--nk, 1)); line-height: 1; color: var(--accent);
    position: relative; top: var(--nfy, 0px); left: var(--nfx, 0px);   /* --nfy/--nfx/--nk: توسيط وتصغير تلقائي للرقم من layout.js */
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 14px rgba(var(--accent-rgb), .32);
    display: flex; justify-content: center; direction: ltr; unicode-bidi: isolate;   /* الخانات دايمًا شمال→يمين حتى جوه صفحة RTL */
  }
  /* انتقال الأرقام: كل خانة ليها عرض ثابت (مفيش اهتزاز أفقي) والرقم القديم بيطلع ويتلاشى والجديد بيطلع من تحت */
  .num .nv { display: flex; justify-content: center; }
  .num .dg { position: relative; display: block; width: var(--dw, .62em); text-align: center; }
  .num .dg.sep { width: .3em; }
  .num .dg b { display: inline-block; font-weight: inherit; }
  .num .o { position: absolute; left: 0; right: 0; top: 0; text-align: center; pointer-events: none; font-style: normal; }
  .num .o::before { content: attr(data-o); }   /* النص القديم بييجي من data-o علشان textContent يفضل الرقم الحالي بس */
  .of { position: absolute; left: 0; right: 0; top: calc(50% + 46px); font-size: 13.5px; color: var(--dim); font-variant-numeric: tabular-nums; }

  .dhikr {
    margin-top: 2px; padding: 2px 16px; border: none; border-radius: 14px;
    background: transparent; color: var(--text); font-size: 25px; transition: background .15s;
  }
  .dhikr:hover { background: rgba(var(--accent-rgb), .08); }
  .total { margin-top: 3px; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; pointer-events: none; }

  /* التحكم السفلي: زر دايري (أيقونة ضبط) في النص. على الماوس عليه: الصوت يمين + الهدف والتصفير شمال بيتفتحوا منه بنعومة.
     الفتح/الإغلاق بيتحكم فيه JS (class .open) علشان الترتيب يبقى: الأيقونات اللي في الطريق تتلاشى الأول ← الأزرار تظهر، وعند الإغلاق الأزرار تتجمّع ← بعدها الأيقونات ترجع بهدوء */
  .ctrl { position: relative; margin-top: auto; width: 100%; height: 30px; display: flex; align-items: center; justify-content: center; pointer-events: none; --dk-shift: 26px; }
  .dk-dot { position: relative; z-index: 1; width: 30px; height: 30px; display: grid; place-items: center; pointer-events: auto; cursor: pointer; color: var(--accent); }   /* نجمة بدون إطار: الشكل نفسه هو الزر */
  .dk-dot svg { width: 20px; height: 20px; overflow: visible; opacity: .55; transform: scale(.95) rotate(0deg); transition: opacity .4s ease, transform .7s cubic-bezier(.22, 1, .36, 1), filter .4s ease; }
  .dk-dot .st { fill: rgba(var(--accent-rgb), 0); stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; transition: fill .4s ease; }
  .dk-dot .core { fill: currentColor; transform-origin: 12px 12px; animation: dkTwinkle 3.4s ease-in-out infinite; }   /* قلب النجمة بيرمّش هادي */
  @keyframes dkTwinkle { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
  .dk-dot:hover svg, .ctrl.open .dk-dot svg { opacity: 1; transform: scale(1.18) rotate(22.5deg); filter: drop-shadow(0 0 3px rgba(var(--accent-rgb), .95)) drop-shadow(0 0 8px rgba(var(--accent-rgb), .55)); }   /* لما الماوس يقرّب: تلمع وتلف نص دورة */
  .dk-dot:hover .st, .ctrl.open .dk-dot .st { fill: rgba(var(--accent-rgb), .22); }
  .dk-dot:hover .core, .ctrl.open .dk-dot .core { animation: none; opacity: 1; transform: scale(1.2); }
  .ctrl.open .dk-dot::after { content: ''; position: absolute; top: -8px; bottom: -8px; left: -140px; right: -140px; border-radius: 22px; }   /* جسر شفاف: الماوس وهو رايح للأزرار ما يفقدش الفتح */
  .ctrl .snd, .ctrl .btns { position: absolute; top: 0; bottom: 0; z-index: 2; display: flex; align-items: center; opacity: 0; visibility: hidden; pointer-events: none; filter: blur(3px);
    transition: opacity .26s ease, transform .3s cubic-bezier(.5, 0, .75, 0), filter .26s ease, visibility 0s linear .3s; }   /* الإغلاق: بيتجمّعوا ناحية الزر بسرعة */
  .ctrl .snd { right: 0; transform-origin: 100% 50%; transform: translateX(calc(var(--dk-shift) * -1)) scale(.86); }
  .ctrl .btns { left: 0; gap: 6px; transform-origin: 0 50%; transform: translateX(var(--dk-shift)) scale(.86); }
  .ctrl.open .snd, .ctrl.open .btns { opacity: 1; visibility: visible; pointer-events: auto; filter: blur(0); transform: none;
    transition: opacity .4s ease .1s, transform .55s cubic-bezier(.22, 1, .36, 1) .1s, filter .4s ease .1s, visibility 0s; }   /* الفتح: بعد ما الأيقونات اللي في الطريق تبدأ تتلاشى بلحظة */
  .ctrl .snd > *, .ctrl .btns > * { opacity: 0; transform: scale(.9); transition: opacity .2s ease, transform .2s ease, color .15s, border-color .15s, background .15s; }
  .ctrl.open .snd > *, .ctrl.open .btns > * { opacity: 1; transform: none; transition: opacity .35s ease .2s, transform .5s cubic-bezier(.22, 1, .36, 1) .2s, color .15s, border-color .15s, background .15s; }
  .ctrl.open .snd.muted .rng { opacity: .3; }
  .ctrl.open .snd > :nth-child(2), .ctrl.open .btns > :nth-child(2) { transition-delay: .27s; }   /* ظهور متتابع خفيف */
  @media (prefers-reduced-motion: reduce) { .ctrl .snd, .ctrl .btns, .ctrl .snd > *, .ctrl .btns > *, .dk-dot svg { transition: none !important; } .dk-dot .core { animation: none; } }
  .pill {
    height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px;
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    transition: color .15s, border-color .15s;
  }
  .pill:hover { color: var(--accent); border-color: rgba(var(--accent-rgb), .45); }
  .pill.confirm { color: #0a0f0c; background: var(--accent); border-color: var(--accent); }
  .snd { display: flex; align-items: center; gap: 4px; }
  .snd .ibtn.off { color: rgba(233,255,244,.28); }
  .rng { -webkit-appearance: none; appearance: none; width: 62px; height: 14px; background: transparent; }
  .rng::-webkit-slider-runnable-track { height: 2px; border-radius: 2px; background: rgba(var(--accent-rgb), .28); }
  .rng::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 6px rgba(var(--accent-rgb), .6);
  }
  .snd.muted .rng { opacity: .3; }

(() => {

      E('circle', { cx: 88, cy: 88, r: RR, fill: 'none', stroke: 'transparent', 'stroke-width': 15, 'pointer-events': 'stroke', class: 'bd' }, ring);   // منطقة ضغط مريحة بين الحبات
      E('path', { d: 'M88 7.5V11', stroke: '#32F5A0', 'stroke-width': 1.6, 'stroke-linecap': 'round', opacity: .8 }, svg);                 // علامة الحبة الحالية

        const b = E('g', { transform: `translate(${(88 + RR * Math.cos(a)).toFixed(2)} ${(88 + RR * Math.sin(a)).toFixed(2)})`, class: 'bd' }, ring);
        const litA = E('g', {}, b);
        shadows.push(E('circle', { cx: 1.3, cy: 2.2, r: R * 1.28, fill: 'url(#bsh)' }, litA));
        E('circle', { r: R, fill: `url(#bs${Math.floor(r() * 4)})` }, litA);
        const tex = E('g', { 'clip-path': 'url(#bclip)', transform: `rotate(${Math.floor(r() * 360)})`, opacity: (.75 + r() * .25).toFixed(2) }, b);
        for (let k = 0; k < 2; k++) E('circle', { cx: ((r() - .5) * R * 1.2).toFixed(2), cy: ((r() - .5) * R * 1.2).toFixed(2), r: (R * (.25 + r() * .3)).toFixed(2), fill: r() < .5 ? 'rgba(0,0,0,.28)' : 'rgba(70,130,100,.10)' }, tex);
        const vein = (col, w) => {                                                                       // عرق غير منتظم بمنحنى
          const t1 = r() * 6.283, t2 = t1 + Math.PI + (r() - .5) * 1.3, q = () => ((r() - .5) * R * 1.2).toFixed(2);

    }

      for (const l of lits) l.setAttribute('transform', c);
    }
    function frame(t) {                                              // زنبرك بتخميد خفيف: لفة سلسة مع ارتداد بسيط
      const dt = Math.min(.05, (t - last) / 1000); last = t;
      vel += ((tgt - cur) * 230 - vel * 23) * dt; cur += vel * dt; apply(cur);

    }

  const STRAND = (() => {

    const STONES = [['#2c6e52', '#0f3123', '#07140e'], ['#265f49', '#0c2b1e', '#06120c'], ['#215c4c', '#0a2b27', '#061514'], ['#2f7453', '#11351f', '#08160e']];

  let audioReady = false, pendingStartup = null;

  function initAudio(a = {}) {
    tickPool = makePool(a.click, POOL_SIZE);
    doneAudio = mkAudio(a.done);        // "بارك الله فيك" (Completion.*) أو الصوت الافتراضي
    startAudio = mkAudio(a.startup);
    exitAudio = mkAudio(a.exit);        // "لسانك" (Exit.*)
    audioReady = true;
    if (pendingStartup) { const v = pendingStartup.volume; pendingStartup = null; playStartup(v); }   // الأمر جه قبل ما الملفات تتجهّز
  }

  function playTick() {                                  // مش بينتظر الصوت؛ play() غير حاجب
    if (!S || !S.sound || S.volume <= 0 || !tickPool.length) return;
    const now = performance.now();
    if (now - lastSound < SOUND_COOLDOWN_MS) return;     // Scroll سريع: نتجاهل بدل ما الصوت يتكدّس
    lastSound = now;
    safePlay(tickPool[tickIdx++ % tickPool.length], S.volume);
  }

  // صوت الاكتمال: بيتنادى مرة واحدة فقط لما الـ main يقول completed، وبـ Volume مستقل.
  // منع التكرار بالوقت (مدة الصوت) مش بحالة العنصر، علشان فشل واحد ما يوقفش الصوت للأبد.
  function playDone() {
    if (!S || !S.completionSound || S.completionVolume <= 0 || !doneAudio) return;
    const now = performance.now();
    if (now - lastDone < Math.min(durMs(doneAudio, 1500), 4000)) return;
    lastDone = now;
    safePlay(doneAudio, S.completionVolume);
  }

  function playStartup(volume) {                         // صوت "فسبحان الله" (مستقل)
    if (!audioReady) { pendingStartup = { volume }; return; }
    // نبلّغ الـ main لما يخلص (أو يفشل) علشان شاشة اللوجو ما تعملش Fade Out وسط الكلام
    let told = false;
    const fin = () => { if (!told) { told = true; clearTimeout(guard); try { window.azkar.startupDone(); } catch (_) {} } };
    const guard = setTimeout(fin, Math.min(durMs(startAudio, 4000) + 1500, 8000));
    if (!startAudio || startAudio._failed) return fin();
    startAudio.onended = fin; startAudio.onerror = fin;
    // قبل نهاية الصوت بـ NEAR_END_MS: الـ main يظهّر المسبحة (دخولها بالأنيميشن بيبدأ وهو بيقول آخر كلمة)
    let near = false;
    const nearEnd = () => { if (!near) { near = true; clearTimeout(nearGuard); try { window.azkar.startupNearEnd(); } catch (_) {} } };
    const NEAR_END_MS = 1250;
    const nearGuard = setTimeout(nearEnd, Math.max(300, durMs(startAudio, 3300) - NEAR_END_MS) + 600);   // احتياطي لو timeupdate ما اشتغلش
    startAudio.ontimeupdate = () => {
      const d = startAudio.duration;
      if (d && isFinite(d) && (d - startAudio.currentTime) * 1000 <= NEAR_END_MS) nearEnd();
    };
    safePlay(startAudio, volume);
  }

  // صوت "لسانك": الـ main بيطلبه فقط عند الإغلاق النهائي، وبعد ما يخلص بنبلّغه علشان يقفل.
  // لو الصوت ما خلصش في مدته (+ هامش) نبلّغ برضه، فالإغلاق عمره ما يستنى الـ timeout الكبير بتاع الـ main.
  function playExit(volume) {
    let finished = false, guard = null;
    const fin = () => { if (!finished) { finished = true; clearTimeout(guard); window.azkar.exitDone(); } };
    if (!exitAudio || exitAudio._failed) return fin();
    exitAudio.onended = fin; exitAudio.onerror = fin;
    guard = setTimeout(fin, Math.min(durMs(exitAudio, 4500) + 1200, 8000));
    try { exitAudio.volume = Math.min(1, Math.max(0, volume)); exitAudio.currentTime = 0; } catch (_) {}
    const p = exitAudio.play();
    if (p && p.catch) p.catch(fin);
  }

  // ───── أحداث جاية من الـ main (كلها بتتسجل مرة واحدة) ─────
  let settleTimer = null;
  window.azkar.onTick(({ completed, shown, state }) => {
    clearTimeout(settleTimer);
    S = { ...(REAL || S || {}), ...state };
    if (completed) {
      const next = S;
      render(shown ? { ...next, ...shown } : next, shown ? shown.count : undefined);   // الرقم والذكر المكتملين لحظة قصيرة، ثم دورة جديدة
      pulse(true);
      playDone();
      // العدّاد عمره ما بيختفي: الرقم يتبدّل مكانه بـ Pop ناعم، القوس يرجع للصفر بنعومة، والدايرة كلها بتاخد نفَس خفيف
      settleTimer = setTimeout(() => {
        render(next);
        if (!reduceMotion) $('dial').animate([{ transform: 'scale(.988)' }, { transform: 'scale(1.018)', offset: .45 }, { transform: 'scale(1)' }], { duration: 520, easing: 'cubic-bezier(.22, 1, .36, 1)' });
      }, reduceMotion ? 0 : 650);
    } else {
      document.body.classList.remove('dip');
      render(S);
      pulse(false);
      playTick();
    }
  });
  window.azkar.onState(s => { clearTimeout(settleTimer); document.body.classList.remove('dip'); render(s); });
  window.azkar.onStartup(({ volume }) => playStartup(volume));
  window.azkar.onExitPlay(({ volume }) => playExit(volume));
  // دخول المسبحة: أول مرة النافذة تظهر (بعد اللوجو). بنستنى فريمين علشان الـ compositor يجهز وما يبقاش فيه تقطيع في أول الأنيميشن
  let entered = false;
  const playEntrance = (animate = true) => {
    if (entered) return; entered = true;
    const b = document.body;
    if (!animate) { b.classList.remove('pre-show'); return; }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      b.classList.add('enter'); b.classList.remove('pre-show');
      setTimeout(() => b.classList.remove('enter'), 2800);
    }));
  };
  setTimeout(() => playEntrance(false), 25000);      // شبكة أمان: المسبحة ماتفضلش مخفية لو الإشارة ماوصلتش
  window.azkar.onShown(() => { requestAnimationFrame(reportRects); playEntrance(); });
  window.azkar.onMiniMorph(dir => startMorph(dir === 'in' ? 'in' : 'out'));
  window.azkar.onMiniBlank(() => document.body.classList.add('morph-blank'));
  window.azkar.onMiniApplied(morphApplied);
  window.azkar.onHover(inside => document.body.classList.toggle('idle', !inside));   // الماوس خارج النافذة = idle


  // ═════ الأذكار المخفية جوه المسبحة نفسها ═════
  // الـ main بيبعت inline:open → الدايرة تتلاشى ويظهر مربع البطاقات مكانها → اختيار بطاقة → المربع يتلاشى وترجع الدايرة بحالة التحدي
  // → الإطار يبدأ يلف (مؤقت الدقيقة) → نتيجة (نجاح/فشل) → رجوع للمسبحة الطبيعية. مفيش نافذة منفصلة في الوضع ده.
  let FILES = {};
  const clamp01 = v => Math.min(1, Math.max(0, v));
  const cbox = $('cbox'), cbDeck = $('cbDeck'), cbCap = $('cbCap'), cardEl = document.querySelector('.card');
  const eTrack = $('eTrack'), eProg = $('eProg'), edgeSvg = $('edge');
  const inl = { phase: 'idle', gen: 0, timers: [], cards: [], hold: null, holdView: null, raf: 0, frozen: true, startsAt: 0, dur: 60000, hoverA: null, blessA: null, lastHover: 0 };
  const later = (fn, ms) => { const t = setTimeout(fn, ms); inl.timers.push(t); return t; };
  const clearLater = () => { inl.timers.forEach(clearTimeout); inl.timers = []; };
  const settleRects = () => { requestAnimationFrame(reportRects); later(reportRects, 600); };      // بعد ما الانتقال يخلص (مناطق التفاعل)
  const popVol = () => { const v = S ? Number(S.popupVolume) : NaN; return Number.isFinite(v) ? clamp01(v) : .5; };

  // الإطار: يرسم محيط الكارت من جواه، يبدأ من منتصف الحافة العلوية ويلف مع عقارب الساعة
  function layoutEdge() {
    const w = cardEl.clientWidth, h = cardEl.clientHeight;          // جوه الـ border
    if (!w || !h) return;                                           // الكارت مخفي (Mini Mode): ResizeObserver هيعيد الحساب لما يظهر
    const sw = 2.5, i = 1.5;
    const r = Math.max(2, (parseFloat(getComputedStyle(cardEl).borderTopLeftRadius) || 30) - 1 - i);
    const x0 = i, y0 = i, x1 = w - i, y1 = h - i, cx = w / 2;
    const d = `M${cx} ${y0} H${x1 - r} A${r} ${r} 0 0 1 ${x1} ${y0 + r} V${y1 - r} A${r} ${r} 0 0 1 ${x1 - r} ${y1} ` +
              `H${x0 + r} A${r} ${r} 0 0 1 ${x0} ${y1 - r} V${y0 + r} A${r} ${r} 0 0 1 ${x0 + r} ${y0} Z`;
    edgeSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    eTrack.setAttribute('d', d); eProg.setAttribute('d', d);
  }
  new ResizeObserver(layoutEdge).observe(cardEl);
  const setProgress = p => { eProg.style.strokeDashoffset = String(100 * (1 - p)); eProg.style.opacity = p > 0.002 ? '1' : '0'; };
  function startEdge(at, dur) {
    cancelAnimationFrame(inl.raf);
    inl.startsAt = at; inl.dur = dur; inl.frozen = false;
    eProg.style.transition = '';
    document.body.classList.add('has-edge');
    layoutEdge(); setProgress(0);
    const loop = () => {
      if (inl.frozen) return;
      setProgress(clamp01((Date.now() - inl.startsAt) / inl.dur));   // 0% → 100% خلال دقيقة بالظبط (بعد فترة الانتقال)
      inl.raf = requestAnimationFrame(loop);
    };
    loop();
  }
  function stopEdge() { inl.frozen = true; cancelAnimationFrame(inl.raf); }
  function freezeEdge(toFull) {
    stopEdge();
    if (toFull) { eProg.style.transition = 'stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)'; setProgress(1); }
  }

  // الصوت
  function playHover() {
    const a = inl.hoverA, v = popVol() * .6;
    if (!a || v <= 0) return;
    const n = performance.now();
    if (n - inl.lastHover < 120) return;                            // حماية من ارتداد الحدود بين بطاقتين
    inl.lastHover = n;
    safePlay(a, v);
  }
  function playChime() {
    if (!FILES.challenge || popVol() <= 0) return;
    const a = mkAudio(FILES.challenge); safePlay(a, popVol());
  }
  function playBlessing(delay) {                                    // "بارك الله فيك" بعد صوت الإنجاز بلحظة؛ بترجّع وقت انتهائه التقريبي
    const a = inl.blessA;
    if (!a || popVol() <= 0) return 0;
    later(() => safePlay(a, popVol()), delay);
    return delay + (isFinite(a.duration) && a.duration > 0 ? a.duration * 1000 : 2200);
  }

  function buildCards(n) {
    cbDeck.textContent = ''; inl.cards = [];
    for (let i = 0; i < n; i++) {
      const b = document.createElement('button');
      b.className = 'cb-card'; b.setAttribute('data-hit', ''); b.setAttribute('aria-label', 'بطاقة مخفية ' + (i + 1));
      const img = document.createElement('img'); img.src = 'assets/logo.png'; img.alt = ''; img.draggable = false;   // اللوجو فقط: مفيش نص بيكشف التحدي
      b.appendChild(img);
      b.addEventListener('pointerenter', () => { if (inl.phase === 'choose') playHover(); });
      b.addEventListener('click', () => inlinePick(i));
      cbDeck.appendChild(b); inl.cards.push(b);
    }
  }

  function inlineOpen(opt) {
    const fast = !!(opt && opt.fast);                               // دخول بالسحب: بدون انتظار
    inlineReset();
    const g = ++inl.gen;
    if (fast) { document.body.classList.add('az-fast', 'inl-on', 'cards-open'); settleRects(); setTimeout(() => document.body.classList.remove('az-fast'), 900); }   // الدايرة تبدأ تتلاشى فورًا بالتوازي مع طلب البيانات
    window.azkar.popupGet().then(cfg => {
      if (g !== inl.gen) return;                                    // اتقفل/اتفتح من جديد قبل ما الرد يوصل
      if (!cfg || cfg.kind !== 'cards') return window.azkar.popupClose();
      inl.hoverA = mkAudio(FILES.hover); inl.blessA = mkAudio(FILES.done);
      buildCards(cfg.cards);
      cbox.classList.remove('lock');
      cbCap.textContent = 'اختر بطاقة';
      inl.phase = 'choose';
      document.body.classList.add('inl-on', 'cards-open');          // 1) الدايرة تتلاشى
      settleRects();
      later(() => {                                                 // 2) بعد ما اختفت يظهر مربع الأذكار مكانها
        cbox.classList.add('show');
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (g !== inl.gen) return;
          cbox.classList.add('in'); settleRects();
        }));
      }, fast ? 80 : 320);
      later(inlineDismiss, 45000);                                  // ما اتفتحتش: ترجع المسبحة لوحدها
    });
  }

  function inlinePick(i) {
    if (inl.phase !== 'choose') return;
    inl.phase = 'picking';
    cbox.classList.add('lock');
    cbCap.textContent = 'تم الاختيار';
    inl.cards.forEach((c, k) => c.classList.add(k === i ? 'sel' : 'dim'));
    window.azkar.popupPick(i);
    later(() => {                                                   // أمان: لو الـ main ما ردّش (مش المفروض) نرجع للاختيار
      if (inl.phase !== 'picking') return;
      inl.phase = 'choose'; cbox.classList.remove('lock'); cbCap.textContent = 'اختر بطاقة';
      inl.cards.forEach(c => c.classList.remove('sel', 'dim'));
    }, 2500);
  }

  // اختيار تم: المربع يختفي بأنيميشن ← الدايرة ترجع بالذكر والعدد ← الإطار يبدأ العدّ
  window.azkar.onPopupReveal(({ index, startsAt, durationMs }) => {
    if (inl.phase !== 'choose' && inl.phase !== 'picking') return;
    clearLater();
    inl.phase = 'running';
    cbox.classList.add('lock');
    inl.cards.forEach((c, k) => { c.classList.toggle('sel', k === index); c.classList.toggle('dim', k !== index); });
    startEdge(startsAt, durationMs);
    later(() => cbox.classList.remove('in'), 360);                  // المربع يتلاشى
    later(() => { document.body.classList.remove('cards-open'); settleRects(); }, 760);   // الدايرة ترجع (فيها الذكر والعدد: الـ main بعت حالة التحدي)
    later(() => cbox.classList.remove('show'), 840);
  });

  function holdResult(kind) {
    const v = REAL || S || {};
    inl.holdView = { count: v.count, target: v.target, dhikrText: v.dhikrText };
    inl.hold = kind;
    document.body.classList.add(kind === 'ok' ? 'res-ok' : 'res-fail');
    if (REAL) render(REAL);
  }
  window.azkar.onPopupSuccess(() => {
    if (inl.phase !== 'running') return;
    inl.phase = 'success';
    freezeEdge(true);
    holdResult('ok');
    playChime();
    const endMs = playBlessing(500);
    later(inlineFinish, Math.max(4200, endMs + 600));               // مايتقفلش قبل ما الصوت يخلص
  });
  window.azkar.onPopupFail(() => {
    if (inl.phase !== 'running') return;
    inl.phase = 'fail';
    freezeEdge(false); setProgress(1);
    holdResult('fail');
    later(inlineFinish, 3200);
  });

  // نهاية التحدي: الإطار يتلاشى، والدايرة تتلاشى لحظة وترجع بحالتها الطبيعية (من غير قفزة في الأرقام)
  function inlineFinish() {
    if (inl.phase !== 'success' && inl.phase !== 'fail') return;
    inl.phase = 'closing';
    document.body.classList.remove('has-edge');
    document.body.classList.add('cards-open');
    later(() => {
      inl.hold = null; inl.holdView = null;
      document.body.classList.remove('res-ok', 'res-fail', 'inl-on');
      stopEdge();
      if (REAL) render(REAL);
      document.body.classList.remove('cards-open');
      settleRects();
      later(() => { inl.phase = 'idle'; window.azkar.popupClose(); }, 480);
    }, 380);
  }

  // إلغاء (زر "إلغاء" أو انتهاء المهلة) قبل اختيار أي بطاقة: المربع يتلاشى وترجع المسبحة
  function inlineDismiss() {
    if (inl.phase !== 'choose') return;
    inl.phase = 'closing';
    clearLater();
    cbox.classList.remove('in');
    later(() => { document.body.classList.remove('cards-open'); settleRects(); }, 380);
    later(() => { cbox.classList.remove('show'); document.body.classList.remove('inl-on'); }, 480);
    later(() => { inl.phase = 'idle'; window.azkar.popupClose(); }, 900);
  }
  $('cbCancel').onclick = inlineDismiss;

  // سحب مربع البطاقات بره المسبحة: بعد حركة بسيطة بيتحول لنافذة تتبع الماوس (والـ main بيدخله تاني لو قرّبته)
  let cdrag = null;
  cbox.addEventListener('pointerdown', ev => {
    if (inl.phase !== 'choose' || ev.button !== 0 || ev.target.closest('#cbCancel')) return;
    cdrag = { x: ev.clientX, y: ev.clientY, sent: false };
    window.azkar.hold(true);
  });
  document.addEventListener('pointermove', ev => {
    if (!cdrag || cdrag.sent || Math.hypot(ev.clientX - cdrag.x, ev.clientY - cdrag.y) < 12) return;
    cdrag.sent = true; window.azkar.inlineUndock();
  });
  const endCdrag = () => { if (!cdrag) return; const s = cdrag.sent; cdrag = null; window.azkar.hold(false); if (s) window.azkar.inlineDragEnd(); };
  document.addEventListener('pointerup', endCdrag);
  document.addEventListener('pointercancel', endCdrag);

  // رجوع فوري لحالة المسبحة الطبيعية (الـ main قفل الإشعار / اتلغى / اتصغّرت المسبحة)
  function inlineReset() {
    inl.gen++;
    if (inl.phase === 'idle') return;
    clearLater(); stopEdge();
    inl.phase = 'idle'; inl.hold = null; inl.holdView = null;
    document.body.classList.remove('cards-open', 'has-edge', 'res-ok', 'res-fail', 'inl-on');
    cbox.classList.remove('in');
    setTimeout(() => { if (inl.phase === 'idle') cbox.classList.remove('show'); reportRects(); }, 450);
    if (REAL) render(REAL);
    requestAnimationFrame(reportRects);
  }
  $('azRest').onclick = () => window.azkar.openSettings('daily:' + (S && S.azRest || 'sl'));   // نوم/استيقاظ: يفتح الذكر مباشرة
  $('azDue').onclick = () => window.azkar.openSettings('daily:' + (S && S.azDue || 'm'));   // ... وهنا
  $('azWird').onclick = () => window.azkar.openSettings('quranread');                                  // يفتح القرآن عند آخر صفحة اتقرت
  $('azWird').oncontextmenu = e => { e.preventDefault(); window.azkar.patch({ wirdDone: true }); };   // كليك يمين = تم الورد: الأيقونة تختفي لحد بكرة
  window.azkar.onInlineOpen(inlineOpen);
  window.azkar.onInlineClose(inlineReset);
  window.azkar.onInlineHint(on => document.body.classList.toggle('dock-hint', !!on));

  // ───── الأزرار ─────
  $('dhikr').onclick = () => {                           // الذكر التالي (الافتراضي + المخصص)
    if (S && S.challenge) return;                        // أثناء التحدي الذكر ثابت
    const list = S.azkar || [];
    if (!list.length) return;
    const i = list.findIndex(a => a.id === S.dhikrId);
    window.azkar.patch({ dhikrId: list[(i + 1) % list.length].id });
  };
  $('goal').onclick  = () => window.azkar.openSettings('target');
  $('sound').onclick = () => window.azkar.patch({ sound: !S.sound });
  $('vol').oninput   = e => window.azkar.patch({ volume: Number(e.target.value) / 100 });
  $('hide').onclick  = () => window.azkar.minimize();         // "–" = Mini Mode
  $('close').onclick = () => window.azkar.quit();             // "✕" = إغلاق كامل

  // التصفير بخطوتين علشان ما يحصلش بالغلط
  let resetTimer = null;
  $('reset').onclick = () => {
    const b = $('reset');
    if (b.classList.contains('confirm')) {
      clearTimeout(resetTimer); b.classList.remove('confirm'); b.textContent = 'تصفير';
      window.azkar.patch({ count: 0, total: 0 });
    } else {
      b.classList.add('confirm'); b.textContent = 'تأكيد؟';
      resetTimer = setTimeout(() => { b.classList.remove('confirm'); b.textContent = 'تصفير'; }, 2200);
    }
  };

  // ───── watchdog: نبلّغ الـ main إن أحداث الماوس بتوصل للصفحة (throttled) ─────
  let lastPing = 0;
  document.addEventListener('pointermove', () => { const n = performance.now(); if (n - lastPing > 100) { lastPing = n; window.azkar.alive(); } }, true);
  document.addEventListener('pointerdown', () => window.azkar.alive(), true);

  // ───── ضغط الماوس على عنصر تفاعلي: الـ main ما يقطعش التفاعل لو المؤشر خرج من العنصر أثناء السحب ─────
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-hit]')) window.azkar.hold(true);
    if (e.target.classList && e.target.classList.contains('rng')) sliding = e.target;
  });
  const release = () => { window.azkar.hold(false); if (sliding) { sliding = null; if (S) render(S); } };
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('blur', release);

  // ───── سحب النافذة يدويًا (المقبض في الوضع الكامل، وأي مكان فاضي في Mini Mode) ─────
  function attachDrag(el, skipSelector) {
    let drag = null;
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0 || (skipSelector && e.target.closest(skipSelector))) return;
      el.setPointerCapture(e.pointerId);
      drag = { x: e.screenX, y: e.screenY };
      window.azkar.dragStart();
    });
    el.addEventListener('pointermove', e => { if (drag) window.azkar.dragMove(e.screenX - drag.x, e.screenY - drag.y); });
    const end = () => { if (drag) { drag = null; window.azkar.dragEnd(); } };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('lostpointercapture', end);
  }
  attachDrag($('grip'));
  (() => {                                                // زر التحكم السفلي: الفتح/الإغلاق بالترتيب (الأيقونات اللي في الطريق تتلاشى الأول، وترجع بهدوء بعد ما الأزرار تتجمّع)
    const ctrl = $('ctrl'); let yielded = [], tOpen = 0, tClose = 0, tBack = 0;
    const SHIFT = 26;                                     // نفس --dk-shift في الـ CSS
    const zones = () => {                                 // مكان الأزرار وهي مفتوحة + الزر نفسه (مش الصف كله، علشان أيقونة الصلاة جنبه تفضل شغّالة)
      const k = ctrl.getBoundingClientRect().width / (ctrl.offsetWidth || 1) || 1, z = [];
      const d = ctrl.querySelector('.dk-dot'), s = ctrl.querySelector('.snd'), b = ctrl.querySelector('.btns');
      if (d) z.push(d.getBoundingClientRect());
      if (s) { const q = s.getBoundingClientRect(); z.push({ left: q.left, right: q.right + SHIFT * k, top: q.top, bottom: q.bottom }); }
      if (b) { const q = b.getBoundingClientRect(); z.push({ left: q.left - SHIFT * k, right: q.right, top: q.top, bottom: q.bottom }); }
      return z;
    };
    const hit = (a, z) => a.right > z.left - 6 && a.left < z.right + 6 && a.bottom > z.top - 6 && a.top < z.bottom + 6;
    const busy = () => ctrl.matches(':hover') || ctrl.querySelector('.pill.confirm') || ctrl.querySelector('.rng:active') || ctrl.contains(document.activeElement) && document.activeElement.matches('.rng:focus-visible');
    const open = () => {
      clearTimeout(tClose); clearTimeout(tBack);
      yielded.forEach(e => { e.style.transitionDelay = ''; });
      let any = false;
      if (!ctrl.classList.contains('open')) {
        const z = zones();
        document.querySelectorAll('.azdue:not([hidden]), .xbox .xel').forEach(el => {
          const b = el.getBoundingClientRect();
          if (b.width && !el.classList.contains('dk-yield') && z.some(q => hit(b, q))) { el.classList.add('dk-yield'); yielded.push(el); any = true; }
        });
      }
      clearTimeout(tOpen);
      tOpen = setTimeout(() => ctrl.classList.add('open'), any ? 70 : 0);       // الأيقونات تبدأ تتلاشى الأول بلحظة ثم الأزرار تفتح
    };
    const close = () => {
      clearTimeout(tOpen); clearTimeout(tClose);
      tClose = setTimeout(function again() {
        if (busy()) { tClose = setTimeout(again, 400); return; }
        ctrl.classList.remove('open');
        clearTimeout(tBack);
        tBack = setTimeout(() => {                                                 // رجوع متتابع وهادي (كل أيقونة بعد اللي قبلها بشوية)
          const list = yielded; yielded = [];
          list.forEach((e, i) => { e.style.transitionDelay = (i * 80) + 'ms'; e.classList.remove('dk-yield'); });
          setTimeout(() => list.forEach(e => { if (!e.classList.contains('dk-yield')) e.style.transitionDelay = ''; }), 1400);
        }, 300);   // الأزرار تخلص تجمّعها ← الأيقونات ترجع
      }, 280);
    };
    ctrl.addEventListener('pointerenter', open);
    ctrl.addEventListener('pointerleave', close);
  })();
  (() => {                                                // ضغطة (من غير سحب) على شعار "وذكّر" = فتح الإعدادات؛ السحب بيحرّك النافذة زي ما كان
    const g = $('grip'); let p0 = null;
    g.addEventListener('pointerdown', e => { if (e.button === 0) p0 = { x: e.screenX, y: e.screenY }; });
    g.addEventListener('pointerup', e => {
      const p = p0; p0 = null;
      if (p && Math.hypot(e.screenX - p.x, e.screenY - p.y) < 5) window.azkar.openSettings(null);
    });
    g.addEventListener('pointercancel', () => { p0 = null; });
  })();
  attachDrag($('mini'), 'button');
  // زر التكبير في الوضع المصغر: بيرجّع المسبحة الكبيرة (نفس إيقاف Mini Mode من الإعدادات)
  $('mExpand').addEventListener('click', e => { e.stopPropagation(); window.azkar.patch({ miniMode: false }); });

  // ───── التسبيح بالنقر على العدّاد (اختياري من الإعدادات) ─────
  $('dial').addEventListener('click', e => {
    if (e.button !== 0 || !S) return;
    const st = S.dialStyle, hit = st === 'beads' ? !!e.target.closest('.bd') : st === 'strand' ? !!e.target.closest('.sb') : false;
    if (S.clickOn || hit) {                                      // حبات السبحة: الضغط على حبة = لفّة + عدّة
      if (st === 'strand') { const sb = e.target.closest('.sb'), i = sb && sb.getAttribute('data-i'); STRAND.hint(i == null ? null : +i); }   // الخرزة اللي اتضغطت هي اللي بتتزقّ
      window.azkar.tick();
    }
  });
  let miniDown = null;
  $('mini').addEventListener('pointerdown', e => { miniDown = { x: e.screenX, y: e.screenY }; });
  $('mini').addEventListener('click', e => {
    if (!S || !S.clickOn || e.button !== 0 || e.target.closest('button')) return;
    if (miniDown && Math.hypot(e.screenX - miniDown.x, e.screenY - miniDown.y) > 5) return;   // ده كان سحب للنافذة مش نقر
    window.azkar.tick();
  });

  // ملحوظة: مفيش wheel listener هنا عمدًا؛ العدّ كله من الـ Global Hook في الـ main.

  $('tagline').textContent = HEADER_TEXT;
  window.azkar.getState().then(s => { FILES = s.audio || {}; initAudio(s.audio); render(s); requestAnimationFrame(reportRects); });
})();
</script>
</body>
